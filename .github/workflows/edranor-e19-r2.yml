name: Edranor E19-R2 cuencas agua
on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/E19-R2/**'
      - 'Tools/EdranorE19R2/**'
      - '.github/workflows/edranor-e19-r2.yml'
  workflow_dispatch:
jobs:
  hydro-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E19-R0 regressions
        run: python Tools/EdranorE19R0/validate.py
      - name: E19-R1 regressions
        run: python Tools/EdranorE19R1/validate.py
      - name: E19-R2 contract and negative tests
        run: python Tools/EdranorE19R2/validate.py
  hydro-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E19-R0 regressions
        run: python Tools/EdranorE19R0/validate.py
      - name: E19-R1 regressions
        run: python Tools/EdranorE19R1/validate.py
      - name: E19-R2 contract and negative tests
        run: python Tools/EdranorE19R2/validate.py
