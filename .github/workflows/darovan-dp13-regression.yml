name: Darovan DP13 physical territory checks

on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/**'
      - 'Tools/DarovanDP13/**'
      - '.github/workflows/darovan-dp13-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dp13-static:
    name: Darovan D.P13 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Darovan D01 D02 D03 source regression
        shell: bash
        run: |
          python "Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Validacion/validate_d01.py"
          python "Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Validacion/validate_d02.py"
          python "Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Validacion/validate_d03.py"
      - name: Physical depth contracts and negative tests
        run: python Tools/DarovanDP13/validate.py
