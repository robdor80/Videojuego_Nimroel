name: Edranor E12 integral closure regression
on:
  push:
    branches:
      - 'feat/edranor-e12-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/**'
      - 'ContentPacks/edranor-territory/**'
      - 'Tools/EdranorE11/**'
      - 'Tools/EdranorE12/**'
      - '.github/workflows/edranor-e12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e12:
    name: E12 cross-phase and Core C++ · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Regress E00 to E10
        shell: bash
        run: |
          for n in 00 01 02 03 04 05 06 07 08 09 10; do
            python "Tools/EdranorE${n}/validate.py"
          done
      - name: E12 independent cross-phase and 24 mutation checks
        run: python Tools/EdranorE12/validate.py
      - name: Checkout fixed official CoreRPG content contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robdor80/CoreRPG
          ref: 4f282863737bcd8f5add401202a9e1064c133672
          path: .edranor-core
      - name: Install pinned JSON Schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Regress E11 source SHA locks, official schemas and 37 adversarial cases
        run: python Tools/EdranorE11/validate.py --core-root .edranor-core
      - name: Configure C++20 CoreRPG structural laboratory
        run: cmake -S Tools/EdranorE11 -B e12-build -DCORERPG_ROOT="${{ github.workspace }}/.edranor-core" -DCMAKE_BUILD_TYPE=Release
      - name: Build CoreRPG C++ pack consumer
        run: cmake --build e12-build --config Release --target edranor_e11_core_smoke --parallel 2
      - name: CTest synthetic catalog persistence and deterministic replay
        run: ctest --test-dir e12-build -C Release --output-on-failure
