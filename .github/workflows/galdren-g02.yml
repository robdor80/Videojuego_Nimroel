name: Galdren G02 hidrologia static
on:
  push:
    branches:
      - 'feat/galdren-g02-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Galdren/**'
      - 'Tools/GaldrenG02/**'
      - '.github/workflows/galdren-g02.yml'
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: G00 regresion
        run: python Tools/GaldrenG00/validate.py
      - name: G01 regresion
        run: python Tools/GaldrenG01/validate.py
      - name: G02 drenaje y ataques
        run: python Tools/GaldrenG02/validate.py
