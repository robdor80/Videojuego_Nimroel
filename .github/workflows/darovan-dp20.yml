name: Darovan D.P20 Veldora authoring validation

on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Profundizacion_2026/D.P20/**'
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Datos operativos/darovan_dp20_veldora_proposals_v0.1.json'
      - 'Tools/DarovanDP20/**'
      - '.github/workflows/darovan-dp20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorship-validation:
    name: D.P20 Veldora · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Validate Veldora D.P20 proposals, canon anchors, and adverse mutations
        run: python Tools/DarovanDP20/validate.py
      - name: Rerun D.P14-D.P18 cross-source contracts
        run: python Tools/DarovanDP14_DP18/validate.py
      - name: Rerun D.P13 territorial relief guardrails
        run: python Tools/DarovanDP13/validate.py
