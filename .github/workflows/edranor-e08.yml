name: Edranor E08 static regression
on:
  push:
    branches:
      - 'feat/edranor-e08-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/**'
      - 'Tools/EdranorE08/**'
      - '.github/workflows/edranor-e08.yml'
jobs:
  e08-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E00
        run: python Tools/EdranorE00/validate.py
      - name: E01
        run: python Tools/EdranorE01/validate.py
      - name: E02
        run: python Tools/EdranorE02/validate.py
      - name: E03
        run: python Tools/EdranorE03/validate.py
      - name: E04
        run: python Tools/EdranorE04/validate.py
      - name: E05
        run: python Tools/EdranorE05/validate.py
      - name: E06
        run: python Tools/EdranorE06/validate.py
      - name: E07
        run: python Tools/EdranorE07/validate.py
      - name: E08
        run: python Tools/EdranorE08/validate.py
