name: Edranor E19-TEC spatial evidence gates
on:
  push:
    branches:
      - 'tech/edranor-e19-tec-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/E19-TEC/**'
      - 'Tools/EdranorE19TEC/**'
      - '.github/workflows/edranor-e19-tec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python Tools/EdranorE19R0/validate.py
      - run: python Tools/EdranorE19R1/validate.py
      - run: python Tools/EdranorE19R2/validate.py
      - run: python Tools/EdranorE19R3/validate.py
      - run: python Tools/EdranorE19R4/validate.py
      - run: python Tools/EdranorE19R5/validate.py
      - run: python Tools/EdranorE19R6/validate.py
      - run: python Tools/EdranorE19TEC/test_spatial.py
      - run: python Tools/EdranorE19TEC/test_causal_atlas.py
      - run: python Tools/EdranorE19TEC/test_drainage_lab.py
      - run: python Tools/EdranorE19TEC/causal_atlas.py --output "${{ runner.temp }}/edranor-causal-catalog.json"
  spatial-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python Tools/EdranorE19R0/validate.py
      - run: python Tools/EdranorE19R1/validate.py
      - run: python Tools/EdranorE19R2/validate.py
      - run: python Tools/EdranorE19R3/validate.py
      - run: python Tools/EdranorE19R4/validate.py
      - run: python Tools/EdranorE19R5/validate.py
      - run: python Tools/EdranorE19R6/validate.py
      - run: python Tools/EdranorE19TEC/test_spatial.py
      - run: python Tools/EdranorE19TEC/test_causal_atlas.py
      - run: python Tools/EdranorE19TEC/test_drainage_lab.py
      - run: python Tools/EdranorE19TEC/causal_atlas.py --output "${{ runner.temp }}/edranor-causal-catalog.json"

  godot-causal-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile conceptual regions from R1-R5 (no physical entities)
        run: python Tools/EdranorE19TEC/causal_atlas.py --output Tools/EdranorE19TEC/GodotLab/catalog_generated.json
      - name: Fetch exact Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output /tmp/edranor-godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/edranor-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Import isolated E19-TEC 2D laboratory
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path Tools/EdranorE19TEC/GodotLab --import --quit
      - name: Read R1-R5 catalog and reject counterfeit B3/B4 in actual Godot
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path Tools/EdranorE19TEC/GodotLab --script res://tests/causal_catalog_smoke.gd
