name: Edranor E18 intermediate maturity audit
on:
  push:
    branches:
      - 'docs/edranor-e18-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/**'
      - 'Tools/EdranorE18/**'
      - '.github/workflows/edranor-e18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e18:
    name: E18 audit and prior Core contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: E00-E10 regression
        shell: bash
        run: |
          for n in 00 01 02 03 04 05 06 07 08 09 10; do
            python "Tools/EdranorE$n/validate.py"
          done
      - name: E12-E17 regression
        shell: bash
        run: |
          for n in 12 13 14 15 16 17; do
            python "Tools/EdranorE$n/validate.py"
          done
      - name: E18 audit and adverse mutations
        run: python Tools/EdranorE18/validate.py
      - name: Checkout pinned CoreRPG
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robdor80/CoreRPG
          ref: 4f282863737bcd8f5add401202a9e1064c133672
          path: .edranor-core
      - name: Install official schema verifier
        run: python -m pip install jsonschema==4.26.0
      - name: E11 official schema and SHA locks
        run: python Tools/EdranorE11/validate.py --core-root .edranor-core
      - name: Configure Core C++20 smoke
        run: cmake -S Tools/EdranorE11 -B e18-build -DCORERPG_ROOT="${{ github.workspace }}/.edranor-core" -DCMAKE_BUILD_TYPE=Release
      - name: Build Core C++20 consumer
        run: cmake --build e18-build --config Release --target edranor_e11_core_smoke --parallel 2
      - name: CTest persistence/determinism
        run: ctest --test-dir e18-build -C Release --output-on-failure
