name: Darovan D.P14–D.P18 documentation contracts

on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/**'
      - 'Tools/DarovanDP14_DP18/**'
      - '.github/workflows/darovan-dp14-dp18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darovan-planning:
    name: Darovan D.P14–D.P18 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Validate D.P14–D.P18 source contracts and negative mutations
        run: python Tools/DarovanDP14_DP18/validate.py
      - name: Rerun source-level D.P13 physics and altimetry regressions
        run: python Tools/DarovanDP13/validate.py
