name: Edranor E11 static and CoreRPG native regression
on:
  push:
    branches:
      - 'feat/edranor-e11-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/**'
      - 'ContentPacks/edranor-territory/**'
      - 'Tools/EdranorE11/**'
      - '.github/workflows/edranor-e11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e11:
    name: E11 validation and native · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Regression E00-E10
        shell: bash
        run: |
          for n in 00 01 02 03 04 05 06 07 08 09 10; do
            python "Tools/EdranorE${n}/validate.py"
          done
      - name: Checkout fixed compatible CoreRPG
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robdor80/CoreRPG
          ref: 4f282863737bcd8f5add401202a9e1064c133672
          path: .edranor-core
      - name: Pinned JSON schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: E11 static locks, canonical guards, official Core schemas and adversarial cases
        run: python Tools/EdranorE11/validate.py --core-root .edranor-core
      - name: Configure real CoreRPG ContentJson laboratory
        run: cmake -S Tools/EdranorE11 -B e11-build -DCORERPG_ROOT="${{ github.workspace }}/.edranor-core" -DCMAKE_BUILD_TYPE=Release
      - name: Build real C++ CoreRPG consumer
        run: cmake --build e11-build --config Release --target edranor_e11_core_smoke --parallel 2
      - name: CTest synthetic catalog save and restore
        run: ctest --test-dir e11-build -C Release --output-on-failure
