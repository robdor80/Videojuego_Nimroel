name: Edranor E19-R1 atlas geografia
on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/E19-R1/**'
      - 'Tools/EdranorE19R1/**'
      - '.github/workflows/edranor-e19-r1.yml'
  workflow_dispatch:
jobs:
  atlas-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E19-R0 source and border regression
        run: python Tools/EdranorE19R0/validate.py
      - name: E19-R1 physical geography, toponymy and negative mutations
        run: python Tools/EdranorE19R1/validate.py
  atlas-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E19-R0 source and border regression
        run: python Tools/EdranorE19R0/validate.py
      - name: E19-R1 physical geography, toponymy and negative mutations
        run: python Tools/EdranorE19R1/validate.py
