name: Darovan D.P21 Taramin authoring validation

on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Profundizacion_2026/D.P21/**'
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Datos operativos/darovan_dp21_taramin_proposals_v0.1.json'
      - 'Tools/DarovanDP21/**'
      - '.github/workflows/darovan-dp21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taramin-contract:
    name: D.P21 Taramin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Validate D.P21 Taramin and adverse mutations
        run: python Tools/DarovanDP21/validate.py
      - name: Rerun D.P20 Veldora
        run: python Tools/DarovanDP20/validate.py
      - name: Rerun D.P14-D.P18
        run: python Tools/DarovanDP14_DP18/validate.py
      - name: Rerun D.P13
        run: python Tools/DarovanDP13/validate.py
