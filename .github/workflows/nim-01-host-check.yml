name: Nimroel · NIM-01 a NIM-05 Host 2D checks

on:
  push:
    branches:
      - main
    paths:
      - "Game/**"
      - "Docs/NIM-02_**"
      - "Docs/NIM-03_**"
      - "Tools/NIM03/**"
      - "Tools/NIM04/**"
      - "Tools/NIM05/**"
      - "Docs/NIM-04_**"
      - "Docs/NIM-05_**"
      - ".github/workflows/nim-01-host-check.yml"
  pull_request:
    paths:
      - "Game/**"
      - "Tools/NIM03/**"
      - "Tools/NIM04/**"
      - "Tools/NIM05/**"
      - "Docs/NIM-04_**"
      - "Docs/NIM-05_**"
      - ".github/workflows/nim-01-host-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-linux-headless:
    name: Godot 4.7.2 import + NIM-01/02/03/04/05 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact official Godot editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output /tmp/nimroel-godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/nimroel-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Import project and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path Game/Host2D --import --quit
      - name: Run NIM-01 smoke tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D --script res://tests/smoke.gd
      - name: Run NIM-02 contract and integration-state smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D --script res://tests/nim02_smoke.gd

      - name: Run NIM-03 Godot diagnostic parsing and regression tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D --script res://tests/nim03_smoke.gd
      - name: Run NIM-04 multiprovider parser and CoreRPG isolation smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D --script res://tests/nim04_smoke.gd
      - name: Run NIM-05 Godot broker and Core boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D --script res://tests/nim05_smoke.gd
      - name: Run offline proxy and voice preflight negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q Tools/NIM03
          python3 -m unittest discover -s Tools/NIM03 -p "test_*.py" -v
      - name: Run NIM-04 broker offline security tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q Tools/NIM04
          python3 -m unittest discover -s Tools/NIM04 -p "test_*.py" -v

      - name: Run NIM-05 Python offline idempotency and concurrency tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q Tools/NIM05
          python3 -m unittest discover -s Tools/NIM05 -p "test_*.py" -v
      - name: Run NIM-03 Android keyboard layout regression tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D --script res://tests/keyboard_layout_smoke.gd

  export-prototype-packages:
    name: Export NIM-05 prototype Windows + Android (not device-tested)
    needs: godot-linux-headless
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JDK 17 for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 --connect-timeout 20 \
            -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Export Windows x64 demonstration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Game/Host2D/export
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path Game/Host2D --import --quit
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D \
            --export-release "Windows MSI x64" export/Nimroel_NIM05_Windows.exe
          test -s Game/Host2D/export/Nimroel_NIM05_Windows.exe
      - name: Prepare temporary debug-signing keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore /tmp/nimroel-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Nimroel NIM01,C=ES" \
            -keyalg RSA -keysize 2048 -validity 3650
      - name: Export Android arm64 demonstration (APK; no device test)
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/nimroel-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path Game/Host2D \
            --export-debug "Samsung Tab S9+ ARM64" export/Nimroel_NIM05_TabS9Plus.apk
          test -s Game/Host2D/export/Nimroel_NIM05_TabS9Plus.apk
      - name: Verify Android ABI and record file checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path("Game/Host2D/export/Nimroel_NIM05_TabS9Plus.apk")
          with zipfile.ZipFile(apk) as z:
              libs = [name for name in z.namelist() if name.startswith("lib/") and name.endswith(".so")]
          assert libs, "El APK no contiene bibliotecas nativas"
          assert all(name.startswith("lib/arm64-v8a/") for name in libs), f"ABI no permitida: {libs}"
          print("APK contiene solamente bibliotecas ARM64:", libs)
          PY
          cd Game/Host2D/export
          sha256sum Nimroel_NIM05_Windows.exe Nimroel_NIM05_Windows.pck \
            Nimroel_NIM05_TabS9Plus.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish NIM-05 prototype packages for manual device testing
        uses: actions/upload-artifact@v4
        with:
          name: NIM05-Godot-Prototype-Windows-Android
          path: Game/Host2D/export/*
          retention-days: 14
          if-no-files-found: error

  real-sherpa-windows-tts:
    name: sherpa-onnx real Spanish TTS on Windows CI (not MSI)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install sherpa-onnx pinned Python runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "sherpa-onnx==1.13.8" numpy
      - name: Download public Spanish TTS model (not committed)
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 --connect-timeout 25 --output model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-sharvard-medium.tar.bz2"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          tar.exe -xjf model.tar.bz2
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run REAL inference and produce SHA256 + realtime factor
        shell: pwsh
        run: |
          python Tools/NIM03/voice_tts_bench.py --model-dir vits-piper-es_ES-sharvard-medium --output-dir nim03-tts-evidence --speaker 0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python Tools/NIM03/voice_tts_bench.py --model-dir vits-piper-es_ES-sharvard-medium --output-dir nim03-tts-evidence --speaker 1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish Windows CI evidence (not tablet or MSI physical test)
        uses: actions/upload-artifact@v4
        with:
          name: NIM03-sherpa-real-TTS-Windows-CI
          path: nim03-tts-evidence/*
          if-no-files-found: error
          retention-days: 14
