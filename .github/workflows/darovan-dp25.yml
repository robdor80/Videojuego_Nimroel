name: Darovan D.P25 characters, relationships and territorial conflicts

on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Profundizacion_2026/D.P25/**'
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Datos operativos/darovan_dp25_personajes_relaciones_conflictos_v0.1.json'
      - 'Tools/DarovanDP25/**'
      - '.github/workflows/darovan-dp25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dp25-editorial-validation:
    name: D.P25 editorial, source PRs and regression - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout current D.P25 PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned D.P23 Draft source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6ee4f4a672a138e29feefb558e41bbf10fbce64e
          path: .tmp_sources/dp23
      - name: Checkout pinned D.P24 Draft source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b0b14db66f1cf1ca0e9eb27f28cde403e3e16a89
          path: .tmp_sources/dp24
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: D.P25 validation, cross-source integrity, adversarial mutations
        run: python Tools/DarovanDP25/validate.py --source-dp23 .tmp_sources/dp23 --source-dp24 .tmp_sources/dp24 --require-external
      - name: Validate D.P23 source proposal
        run: python .tmp_sources/dp23/Tools/DarovanDP23/validate.py
      - name: Validate D.P24 source proposal
        run: python .tmp_sources/dp24/Tools/DarovanDP24/validate.py
      - name: D.P20 Veldora regression
        run: python Tools/DarovanDP20/validate.py
      - name: D.P21 Taramin regression
        run: python Tools/DarovanDP21/validate.py
      - name: D.P22 Syvaris regression
        run: python Tools/DarovanDP22/validate.py
      - name: D.P14–18 regression
        run: python Tools/DarovanDP14_DP18/validate.py
      - name: D.P13 regression
        run: python Tools/DarovanDP13/validate.py
