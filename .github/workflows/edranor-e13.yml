name: Edranor E13 physical parity and regression
on:
  push:
    branches:
      - 'feat/edranor-e13-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/**'
      - 'Tools/EdranorE13/**'
      - '.github/workflows/edranor-e13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e13:
    name: E13 design + E00-E12 + Core C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Regress E00 through E10
        shell: bash
        run: |
          for n in 00 01 02 03 04 05 06 07 08 09 10; do
            python "Tools/EdranorE${n}/validate.py"
          done
      - name: Crossphase E12
        run: python Tools/EdranorE12/validate.py
      - name: E13 atlas invariants and adversarial mutations
        run: python Tools/EdranorE13/validate.py
      - name: Checkout fixed CoreRPG content contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robdor80/CoreRPG
          ref: 4f282863737bcd8f5add401202a9e1064c133672
          path: .edranor-core
      - name: Pinned schema validation dependency
        run: python -m pip install jsonschema==4.26.0
      - name: E11 official schemas, SHA locks and adversarial regressions
        run: python Tools/EdranorE11/validate.py --core-root .edranor-core
      - name: Configure Core C++20 structural smoke tests
        run: cmake -S Tools/EdranorE11 -B e13-build -DCORERPG_ROOT="${{ github.workspace }}/.edranor-core" -DCMAKE_BUILD_TYPE=Release
      - name: Build CoreRPG C++ pack consumer
        run: cmake --build e13-build --config Release --target edranor_e11_core_smoke --parallel 2
      - name: CTest catalog, persistence and determinism
        run: ctest --test-dir e13-build -C Release --output-on-failure
