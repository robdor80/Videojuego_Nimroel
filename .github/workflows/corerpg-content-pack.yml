name: CoreRPG content pack 4.13
on:
  push:
    paths: ['ContentPacks/treskal-villages/**', 'Tools/CoreRPG413/**', '.github/workflows/corerpg-content-pack.yml']
  pull_request:
    paths: ['ContentPacks/treskal-villages/**', 'Tools/CoreRPG413/**', '.github/workflows/corerpg-content-pack.yml']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robdor80/CoreRPG
          ref: 864e1788a11e6541805342945896195e3d1ae699
          path: .corerpg-validation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Tools/CoreRPG413/requirements.txt
      - run: python Tools/CoreRPG413/pack.py --check
      - run: python Tools/CoreRPG413/validate.py --core-root .corerpg-validation
      - run: python -m unittest discover -s Tools/CoreRPG413 -p test_pack.py -v
        env:
          CORERPG_SOURCE_DIR: .corerpg-validation
