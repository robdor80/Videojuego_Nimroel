name: Edranor E05 static regression
on:
  push:
    branches:
      - 'feat/edranor-e05-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/**'
      - 'Tools/EdranorE05/**'
      - '.github/workflows/edranor-e05.yml'
jobs:
  e05-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E00 foundation regression
        run: python Tools/EdranorE00/validate.py
      - name: E01 relief regression
        run: python Tools/EdranorE01/validate.py
      - name: E02 hydrology regression
        run: python Tools/EdranorE02/validate.py
      - name: E03 climate regression
        run: python Tools/EdranorE03/validate.py
      - name: E04 economy regression
        run: python Tools/EdranorE04/validate.py
      - name: E05 roads communications and negative tests
        run: python Tools/EdranorE05/validate.py
