name: Edranor E01 static regression
on:
  push:
    branches:
      - 'feat/edranor-e01-*'
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Edranor/**'
      - 'Tools/EdranorE01/**'
      - '.github/workflows/edranor-e01.yml'
jobs:
  e01-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E00 regression
        run: python Tools/EdranorE00/validate.py
      - name: E01 static and negative tests
        run: python Tools/EdranorE01/validate.py
