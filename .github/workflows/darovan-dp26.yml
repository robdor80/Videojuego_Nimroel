name: Darovan D.P26 integral editorial closure audit

on:
  pull_request:
    paths:
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Profundizacion_2026/D.P26/**'
      - 'Worldbuilding/Reinos/Reinos de los Hombres/Norgard/Territorios/Casa Darovan/Datos operativos/darovan_dp26_cierre_editorial_v0.1.json'
      - 'Tools/DarovanDP26/**'
      - '.github/workflows/darovan-dp26.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-audit:
    name: D.P26 external SHA sources and adversarial audit - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout D.P26
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned D.P23 (PR 46)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6ee4f4a672a138e29feefb558e41bbf10fbce64e
          path: .tmp_sources/dp23
      - name: Checkout pinned D.P24 (PR 47)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b0b14db66f1cf1ca0e9eb27f28cde403e3e16a89
          path: .tmp_sources/dp24
      - name: Checkout pinned D.P25 (PR 48)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 2288d79ab03ed7d5a7509943ec140d3387b8f76f
          path: .tmp_sources/dp25
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: D.P26 SHA, biography, permissions, relationship and conflict audit
        run: python Tools/DarovanDP26/validate.py --source-dp23 .tmp_sources/dp23 --source-dp24 .tmp_sources/dp24 --source-dp25 .tmp_sources/dp25 --require-external
      - name: Source D.P23 original validation
        run: python .tmp_sources/dp23/Tools/DarovanDP23/validate.py
      - name: Source D.P24 original validation
        run: python .tmp_sources/dp24/Tools/DarovanDP24/validate.py
      - name: D.P25 with original pinned source branches
        run: python .tmp_sources/dp25/Tools/DarovanDP25/validate.py --source-dp23 .tmp_sources/dp23 --source-dp24 .tmp_sources/dp24 --require-external
      - name: Main D.P20
        run: python Tools/DarovanDP20/validate.py
      - name: Main D.P21
        run: python Tools/DarovanDP21/validate.py
      - name: Main D.P22
        run: python Tools/DarovanDP22/validate.py
      - name: Main D.P14-D.P18
        run: python Tools/DarovanDP14_DP18/validate.py
      - name: Main D.P13
        run: python Tools/DarovanDP13/validate.py
